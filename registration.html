<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Book Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <table width="100%" cellspacing="0" cellpadding="8">
            <tr>
                <td align="right" width="33%">
                    <img src="bookstore.png" alt="Book Store Logo" height="45">
                </td>
                <td align="center" width="34%">
                    <h1>Book Store</h1>
                </td>
                <td width="33%"></td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <nav>
                        <a href="index.html">Home</a>
                        <a href="login.html">Login</a>
                        <a href="registration.html">Registration</a>
                        <a href="catalogue.html">Catalogue</a>
                        <a href="cart.html">Cart</a>
                    </nav>
                </td>
            </tr>
        </table>
    </header>

    <main>
        <section class="form-panel">
            <h2>Registration</h2>
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="email">E-mailid</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label>Sex</label>
                    <div class="inline-options">
                        <label><input type="radio" name="sex" value="male"> Male</label>
                        <label><input type="radio" name="sex" value="female"> Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date of birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label>Languages known</label>
                    <div class="inline-options checkbox-grid">
                        <label><input type="checkbox" name="languages" value="english"> English</label>
                        <label><input type="checkbox" name="languages" value="telugu"> Telugu</label>
                        <label><input type="checkbox" name="languages" value="hindi"> Hindi</label>
                        <label><input type="checkbox" name="languages" value="tamil"> Tamil</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address"></textarea>
                </div>

                <div class="button-row">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
